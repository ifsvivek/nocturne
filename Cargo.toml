[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.5.2"
description = "A native, cinematic desktop media client (Jellyfin, local folders), Linux first, playing video through libmpv"
license = "GPL-3.0-or-later"
repository = "https://github.com/ifsvivek/nocturne"
homepage = "https://nocturne.ifsvivek.in"
readme = "README.md"
keywords = ["jellyfin", "media-player", "mpv", "wayland", "linux"]
categories = ["multimedia::video", "gui"]
authors = ["ifsvivek"]
# MSRV is the highest declared by a dependency (uuid 1.89). `cargo check --workspace --locked` passes on 1.89.0; clippy and tests run on current stable only.
rust-version = "1.89"

[profile.release]
# Measured clean builds, 16 cores: thin/16 cgu 135 s, 31 MB; fat/1 cgu 267 s, 24 MB.
lto = "fat"
codegen-units = 1
strip = true
# panic stays "unwind": worker-thread panics must not abort the UI, and we never unwind through libmpv callbacks.

# Debug builds: the full debuginfo of every dependency made each worktree's target 5 GB or more. Keep line tables for our crates (backtraces), none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# QA and package-test builds (scripts set PROFILE_FLAGS to use it): release code, but thin LTO and 16 codegen units so the long single-core link phase disappears. Published artifacts use `release`.
[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = false

# Theme conformance runs: optimised code (so the engine's time budget is judged fairly) with the debug-only snapshot and key hooks.
[profile.conformance]
inherits = "fast-release"
debug-assertions = true
