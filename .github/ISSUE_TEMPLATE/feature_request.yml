name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/ROADMAP.md](https://github.com/ifsvivek/nocturne/blob/main/docs/ROADMAP.md) first: Live TV, DLNA,
        casting and gapless music are intentionally out of scope; macOS and Windows builds are planned but not started yet
        ([docs/PLATFORMS.md](https://github.com/ifsvivek/nocturne/blob/main/docs/PLATFORMS.md)).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
