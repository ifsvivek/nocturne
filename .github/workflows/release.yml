name: Release

# Pushing a version tag (vX.Y.Z) builds every format and creates a DRAFT GitHub release with all artifacts, SHA256SUMS and the
# CHANGELOG section as notes. Nothing is published automatically and no signing happens here: the pacman/apt/dnf repositories are
# signed locally by the maintainer (scripts/publish-repo.sh), who then publishes the draft. See docs/PACKAGING.md "Releasing".
# Re-run for an existing tag with workflow_dispatch (run it from main so the build caches land where tag runs can read them).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.5.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag matches Cargo.toml
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$TAG" = "v$ver" ] || { echo "tag $TAG does not match Cargo.toml version $ver" >&2; exit 1; }
      # scripts/build-linux-bin.sh keeps cargo, rustup and the target dir in the docker volume below; backing it with a host
      # directory lets actions/cache carry it between runs. Tag runs can only read caches saved from main, see the header.
      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nocturne-cache
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-linux-${{ hashFiles('Cargo.lock') }}-
            cargo-linux-
      - name: Cache volume
        run: |
          mkdir -p ~/nocturne-cache
          docker volume create --driver local --opt type=none --opt o=bind --opt device="$HOME/nocturne-cache" nocturne-cache-debian-stable
      # One binary (fat LTO, debian:stable glibc), then every package reuses it: the later scripts find nothing left to compile.
      - name: Build binary and tarball
        id: build
        env:
          PROFILE: release
        run: scripts/package.sh tarball
      - name: Save build cache
        if: steps.build.outcome == 'success'
        run: sudo chown -R "$USER" ~/nocturne-cache
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outcome == 'success'
        with:
          path: ~/nocturne-cache
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: .deb
        env:
          PROFILE: release
        run: scripts/package.sh deb
      - name: .rpm
        env:
          PROFILE: release
        run: scripts/package.sh rpm
      - name: Checksums and sizes
        run: |
          cd dist
          for f in nocturne_*_amd64.deb nocturne-*.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -l ./*.tar.gz ./*.deb ./*.rpm ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/nocturne-*-linux.tar.gz
            dist/nocturne-*-linux.tar.gz.sha256
            dist/nocturne_*_amd64.deb
            dist/nocturne_*_amd64.deb.sha256
            dist/nocturne-*.rpm
            dist/nocturne-*.rpm.sha256
          retention-days: 7
          if-no-files-found: error

  # Best effort: the AppImage was rejected for its size (about 107 MB) and for bundling an older libmpv, see docs/PACKAGING.md.
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build AppImage
        env:
          PROFILE: release
        run: scripts/package-appimage.sh
      - name: Size
        run: |
          {
            echo "### AppImage"
            for f in dist/*.AppImage; do echo "- $(basename "$f"): $(du -h "$f" | cut -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"
          cd dist && for f in *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          retention-days: 7
          if-no-files-found: ignore

  platforms:
    uses: ./.github/workflows/platforms.yml
    with:
      targets: both
      ref: ${{ inputs.tag || github.ref }}

  publish:
    needs: [linux, appimage, platforms]
    # appimage may fail (continue-on-error); everything else must pass.
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.platforms.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only for scripts/changelog-section.sh and CHANGELOG.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f -exec mv {} out/ \;
          shopt -s extglob
          (cd out && sha256sum !(*.sha256) > SHA256SUMS && cat SHA256SUMS)
          notes=notes.md
          scripts/changelog-section.sh "${TAG#v}" > "$notes"
          ls out/*.AppImage >/dev/null 2>&1 || printf '\nThe AppImage is not part of this release: its build failed or was skipped, see the workflow run.\n' >> "$notes"
          # A draft left by an earlier run of this tag is replaced; a published release is never touched.
          if gh release list --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG\" and .isDraft) | .tagName" | grep -q .; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" out/* --draft --verify-tag --title "NOCTURNE ${TAG#v}" --notes-file "$notes"
