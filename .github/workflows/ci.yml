name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      # Dependencies from docs/PACKAGING.md. libmpv is loaded at run time, not linked; mpv is installed so tests that probe it behave like a user's machine.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust pkgconf mpv dbus fontconfig freetype2 libglvnd \
            libxkbcommon vulkan-icd-loader wayland
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
