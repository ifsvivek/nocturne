# Licence policy for a GPL-3.0-or-later project. `cargo deny check licenses bans sources` (see scripts/ci-checks.sh).
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = [
  "GPL-3.0-or-later", # our own crates
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
  "Unicode-3.0", "CC0-1.0", "Unlicense", "BSL-1.0", "MPL-2.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
