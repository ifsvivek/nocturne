[package]
name = "nocturne-core"
description = "UI-framework-free logic shared by NOCTURNE front ends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
nocturne-jellyfin = { path = "../jellyfin" }
nocturne-local = { path = "../local" }
nocturne-jellyfin-admin = { path = "../jellyfin-admin" }
nocturne-jellyfin-user = { path = "../jellyfin-user" }
nocturne-player = { path = "../player" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
serde_json = "1.0.154"
base64 = "0.23"
sha2 = "0.10"
# Already in the tree through rustls; used only to verify the ed25519 signature of updates.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "alloc"] }
getrandom = "0.4"
nocturne-session = { path = "../session" }
nocturne-seerr = { path = "../seerr" }
# WOFF/WOFF2 web fonts from theme stylesheets are decoded to TTF/OTF (pure Rust, MIT) and checked with ttf-parser before use.
wuff = "0.2.10"
ttf-parser = "0.25"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }

# D-Bus (MPRIS, idle inhibit) is Linux only; see player_mpris.rs.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6.5"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
