[package]
name = "video-proto"
description = "Feasibility prototype: libmpv video inside a GPUI window via a Wayland subsurface"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gpui = "0.2.2"
libmpv2 = "7.0.1"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client"] }
