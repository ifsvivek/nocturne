[package]
name = "nocturne-ui"
description = "Iced front end of NOCTURNE (replaces the GPUI app at the cut-over)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "nocturne-iced"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced", "lazy", "canvas"] }
nocturne-core = { path = "../core" }
nocturne-jellyfin = { path = "../jellyfin" }
nocturne-jellyfin-admin = { path = "../jellyfin-admin" }
nocturne-jellyfin-user = { path = "../jellyfin-user" }
nocturne-session = { path = "../session" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
libc = "0.2"

# Only while GPUI shares the workspace: gpui's wgpu fork (naga 25) turns on codespan-reporting's
# `termcolor`, which breaks naga 27 (iced's wgpu) unless naga 27 enables its own `termcolor` too.
# Delete with the GPUI app at the cut-over.
naga = { version = "27", default-features = false, features = ["termcolor"] }
