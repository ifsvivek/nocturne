[package]
name = "nocturne-app"
description = "NOCTURNE desktop client (GPUI)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nocturne"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
nocturne-jellyfin = { path = "../jellyfin" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
# Authenticated image GETs (the jellyfin client exposes URLs and the auth header, not bytes).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Procedural film-grain texture only.
image = { version = "0.25.1", default-features = false, features = ["png"] }
