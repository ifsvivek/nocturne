[package]
name = "nocturne-app"
description = "Iced front end of NOCTURNE"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "nocturne"
path = "src/main.rs"

[features]
# The element-tree theme engine (`docs/dev/THEME_ENGINE_PLAN.md`): Home, header, Library, Search, Detail and the player bar are styled trees. On by default since 0.5.2; `cargo build --no-default-features` gives the hand-written screens only, and `NOCTURNE_ENGINE_UI=0` selects them at run time.
default = ["theme-engine"]
theme-engine = ["dep:nocturne-style"]

[dependencies]
# Iced default features minus `x11`: Linux is Wayland-only, no X11 crates in the build.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "tokio", "image", "svg", "advanced", "lazy", "canvas"] }
nocturne-core = { path = "../core" }
nocturne-local = { path = "../local" }
nocturne-jellyfin = { path = "../jellyfin" }
nocturne-jellyfin-admin = { path = "../jellyfin-admin" }
nocturne-jellyfin-user = { path = "../jellyfin-user" }
nocturne-session = { path = "../session" }
nocturne-seerr = { path = "../seerr" }
nocturne-arr = { path = "../arr" }
nocturne-player = { path = "../player" }
# The element-tree theme engine, behind the `theme-engine` feature.
nocturne-style = { path = "../style", optional = true }
serde_json = "1.0.154"
png = "0.18"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
gilrs = "0.11.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3.27.0"
