[package]
name = "nocturne-session"
description = "Persist the NOCTURNE login: token in the system keyring (Secret Service), server URLs in XDG config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
nocturne-jellyfin-user = { path = "../jellyfin-user" } # Session type
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
