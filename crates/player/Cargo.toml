[package]
name = "nocturne-player"
description = "mpv playback for NOCTURNE: in-window libmpv (Wayland subsurface) with a child-process fallback"
version.workspace = true
edition.workspace = true

# Embedding glue is coupled to gpui 0.2.2 internals (shared wl_display); keep these pinned and re-test on bumps.
[dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"
libmpv2 = "=7.0.1"
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
wayland-client = "=0.31.15"
wayland-egl = "=0.32.11"
wayland-protocols = { version = "=0.32.13", features = ["client"] }

[dev-dependencies]
nocturne-jellyfin = { path = "../jellyfin" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
