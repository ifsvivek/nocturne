[package]
name = "nocturne-player"
description = "mpv playback control for NOCTURNE (mpv runs as a child process with its own window)"
version.workspace = true
edition.workspace = true

[dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
nocturne-jellyfin = { path = "../jellyfin" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
