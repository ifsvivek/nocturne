[package]
name = "nocturne-player"
description = "mpv playback for NOCTURNE: in-window libmpv (Wayland subsurface) with a child-process fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

# Embedding glue shares the UI toolkit's wl_display (raw handles); keep these pinned and re-test on any UI-toolkit or wayland-* bump.
[dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"
libloading = "0.8.9"

# In-window video is a Wayland subsurface: Linux only (macOS/Windows use the external mpv for now).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
wayland-client = "=0.31.15"
wayland-egl = "=0.32.11"
wayland-protocols = { version = "=0.32.13", features = ["client"] }

# In-window video on Windows: a child window of the app's HWND that mpv.exe draws into.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
nocturne-jellyfin = { path = "../jellyfin" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
