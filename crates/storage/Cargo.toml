[package]
name = "nocturne-storage"
description = "Storage roots for NOCTURNE's server: local folders, mounted SMB/NFS shares (detected, or mounted in user space through GVfs) and remote storage agents; space, health, mount detection and path safety"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
# `stream`: file bodies go to an agent without being loaded into memory.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["process", "time", "io-util", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
