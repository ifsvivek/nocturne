[package]
name = "nocturne-seerr"
description = "Seerr client for NOCTURNE: sign-in, search, details, and media requests (writes only after the user's confirmation; test against a throwaway Seerr only)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
nocturne-jellyfin-admin = { path = "../jellyfin-admin" } # TestServerGuard of the Jellyfin behind the throwaway Seerr
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
